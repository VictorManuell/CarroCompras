<navbar [items]="items" (openEventEmitter)="closeCart()" />

<div class="container my-4">
  <h2>Catalogo de productos App!!</h2>
  <catalogo
    [products]="products"
    (productEventEmitter)="onAddCart($event)"
  ></catalogo>

  @if (showCart) {
    <cart-modal
      [items]="items"
      (idProductEventEmitter)="onDeleteCart($event)"
      (closeEventEmitter)="closeCart()"
    />
  }
</div>
